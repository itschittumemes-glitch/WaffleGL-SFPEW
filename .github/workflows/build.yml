name: Build MGLegacy plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the .so files are there
        run: |
          ls -l app/src/main/jniLibs/arm64-v8a/
          test -n "$(ls app/src/main/jniLibs/arm64-v8a/*.so 2>/dev/null)" || (echo "ERROR: no .so files found in app/src/main/jniLibs/arm64-v8a/" && exit 1)

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MGLegacy-apk
          path: app/build/outputs/apk/debug/*.apk
